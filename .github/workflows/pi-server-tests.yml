name: Validar API Pi
on:
  push:
    paths:
      - 'pi-server/**'
      - '.github/workflows/pi-server-tests.yml'
  pull_request:
    paths:
      - 'pi-server/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe do servidor
        run: node --check server.mjs
      - name: Testes de segurança
        run: node --test server.test.mjs
