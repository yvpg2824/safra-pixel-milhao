<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minhas seleções | SAFRA Pixel do Milhão</title><script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;background:#0b1423;color:#f4f0e9;max-width:880px;margin:auto;padding:22px}
h1{color:#e0bd73}button,a.action{display:inline-block;background:#e0bd73;color:#17170d;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
button:disabled{opacity:.55}a{color:#f5d597}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.item{border:1px solid #485875;background:#15233a;border-radius:12px;padding:15px}
.item h2{font-size:17px;margin:0 0 8px}small,.note{color:#b8c6da}.state{color:#ead098;font-weight:700}#message{white-space:pre-wrap;background:#172942;padding:12px;border-radius:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.empty{padding:20px;border:1px dashed #6b7890;border-radius:10px}
</style></head><body>
<header><div><small>SAFRA · PIXEL DO MILHÃO</small><h1>Minhas seleções</h1></div><a href="./">Voltar ao mural</a></header>
<p>Consulte as áreas que você registrou com sua conta Pi. <strong>Um interesse registrado não significa compra, pagamento confirmado ou propriedade de pixels.</strong></p>
<button id="login" type="button">Entrar com Pi e consultar seleções</button>
<p id="message" role="status">Nenhuma cobrança será feita nesta página.</p>
<div id="summary" class="note" aria-live="polite"></div>
<section id="entries" class="grid" aria-label="Suas seleções"></section>
<script>
(()=>{'use strict';
const endpoint='https://ybrfyemtbilrtuqdftpl.supabase.co/functions/v1/pixel-my-interests';
const btn=document.getElementById('login'),out=document.getElementById('message'),list=document.getElementById('entries'),sum=document.getElementById('summary');
const format=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:7});
btn.addEventListener('click',async()=>{
btn.disabled=true;list.replaceChildren();sum.textContent='';out.textContent='Autenticando com a Pi Network…';
try{
if(!window.Pi)throw Error('Abra esta página no Pi Browser ou no Sandbox do aplicativo.');
await Pi.init({version:'2.0',sandbox:true});
const auth=await Pi.authenticate(['username'],()=>{out.textContent='Há um pagamento incompleto na conta. Esta página apenas consulta interesses.'});
if(!auth?.accessToken)throw Error('Autenticação Pi não autorizada.');
out.textContent='Consultando seus interesses registrados…';
const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:auth.accessToken}),cache:'no-store'});
const data=await response.json();if(!response.ok)throw Error(data.error||'Consulta indisponível.');
const rows=Array.isArray(data.interests)?data.interests:[];
sum.textContent=rows.length+' interesse(s) encontrado(s) · '+rows.filter(r=>r.eligibleForPreparation).length+' com bloqueio de área registrado.';
for(const item of rows){
const card=document.createElement('article');card.className='item';
const title=document.createElement('h2');title.textContent='Área '+item.size+'×'+item.size+' pixels';
const coords=document.createElement('p');coords.textContent='Posição: X '+item.x+' · Y '+item.y;
const zone=document.createElement('p');zone.textContent='Zona: '+(item.zone||'não informada')+' · Preço de referência: '+format(item.amount_pi)+' Pi';
const state=document.createElement('p');state.className='state';state.textContent=item.eligibleForPreparation?'Interesse registrado · área bloqueada para seleção':'Interesse registrado · sem bloqueio confirmado';
const info=document.createElement('small');info.textContent='Status de pagamento não verificado nesta tela. Nenhuma compra foi realizada aqui.';
card.append(title,coords,zone,state,info);list.append(card);
}
out.textContent=rows.length?'Seus interesses foram carregados. Esta página é somente consulta.':'Nenhum interesse encontrado nesta conta.';
if(!rows.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Selecione uma área no mural e salve seu interesse para visualizá-lo aqui.';list.append(empty);}
}catch(err){out.textContent='Não foi possível consultar: '+(err?.message||'erro de conexão');}
finally{btn.disabled=false;}
});
})();
</script></body></html>
